<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minh họa: MCP</title><style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#6b7280;--line:#d9dde3;--accent:#2f6f6a;--soft:#2f6f6a22;--r:8px}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b1f;--fg:#e6e6e6;--muted:#9aa0a6;--line:#33353a;--accent:#5bb3ab;--soft:#5bb3ab22}}:root[data-theme=dark]{--bg:#1b1b1f;--fg:#e6e6e6;--muted:#9aa0a6;--line:#33353a;--accent:#5bb3ab;--soft:#5bb3ab22}*{box-sizing:border-box}html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.stage{min-height:266px;max-width:720px;margin:auto}.caption{min-height:2.6em;margin:12px 0 0;color:var(--muted);font-size:14px}.btn{margin-top:8px;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--bg);font:inherit;cursor:pointer}.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.diagram{display:grid;grid-template-columns:1fr 1.25fr;gap:16px;align-items:center;min-height:266px}.ai,.tool{border:1px solid var(--line);border-radius:var(--r);padding:13px}.ai{text-align:center;font-weight:650;min-height:94px;display:grid;place-items:center}.tools{display:grid;gap:8px}.tool{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:center;padding:8px 10px;opacity:.35;transition:opacity .4s,border-color .4s,background .4s}.socket{width:10px;height:10px;border:1px solid var(--line);border-radius:50%}.tool.on{opacity:1;border-color:var(--accent);background:var(--soft)}.tool.on .socket{background:var(--accent);border-color:var(--accent)}.wire{height:1px;background:var(--line);transform-origin:left;transition:background .4s}.wire.on{background:var(--accent)}.side{font-size:12px;color:var(--muted)}@media(max-width:390px){body{padding:12px}.stage,.diagram{min-height:244px}.diagram{gap:10px}.ai{padding:8px;min-height:82px}.tool{padding:6px 7px}.caption{font-size:13px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="stage" id="stage"></div><p class="caption" id="caption" aria-live="polite"></p><button class="btn" id="replay" type="button">Chạy lại</button><script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;addEventListener('message',function(e){if(e.data&&(e.data.theme==='dark'||e.data.theme==='light'))document.documentElement.dataset.theme=e.data.theme});var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,stage=document.getElementById('stage'),caption=document.getElementById('caption'),timer,cycle,i;function reset(){stage.innerHTML='<div class="diagram"><div class="ai">Claude<div class="side">AI</div></div><div class="tools"><div class="tool" id="file"><span class="socket"></span><span>Tệp tin</span></div><div class="wire" id="wf"></div><div class="tool" id="web"><span class="socket"></span><span>Web</span></div><div class="wire" id="ww"></div><div class="tool" id="db"><span class="socket"></span><span>Cơ sở dữ liệu</span></div></div></div>'}function on(id,wire,yes){document.getElementById(id).classList.toggle('on',yes);document.getElementById(wire).classList.toggle('on',yes)}var steps=[['Bước 1: AI có thể kết nối với các công cụ qua những “ổ cắm” chung.',function(){}],['Bước 2: Cắm Tệp tin — giờ AI đọc được file bạn cho phép.',function(){on('file','wf',true)}],['Bước 3: Cắm Web — giờ AI có thể tra cứu trên mạng.',function(){on('web','ww',true)}],['Bước 4: Rút Web ra — khả năng tra cứu đó biến mất.',function(){on('web','ww',false)}],['Bước 5: MCP là chuẩn chung để AI cắm hoặc rút công cụ.',function(){on('db','ww',false)}]];function play(){clearTimeout(timer);clearTimeout(cycle);reset();i=0;if(reduce){steps.forEach(function(s){s[1]()});caption.textContent='1. AI có các ổ cắm.  2. Cắm Tệp tin.  3. Cắm Web.  4. Rút Web.  5. MCP là chuẩn chung.';return}(function next(){if(i>=steps.length){cycle=setTimeout(play,3000);return}caption.textContent=steps[i][0];steps[i++][1]();timer=setTimeout(next,1800)})()}document.getElementById('replay').onclick=play;play();function h(){try{parent.postMessage({type:'minhhoa-height',height:document.body.scrollHeight},'*')}catch(e){}}addEventListener('load',h);if(window.ResizeObserver)new ResizeObserver(h).observe(document.body)})();</script></body></html>
