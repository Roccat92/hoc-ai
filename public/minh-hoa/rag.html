<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minh họa: RAG</title><style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#6b7280;--line:#d9dde3;--accent:#2f6f6a;--soft:#2f6f6a22;--r:8px}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b1f;--fg:#e6e6e6;--muted:#9aa0a6;--line:#33353a;--accent:#5bb3ab;--soft:#5bb3ab22}}:root[data-theme=dark]{--bg:#1b1b1f;--fg:#e6e6e6;--muted:#9aa0a6;--line:#33353a;--accent:#5bb3ab;--soft:#5bb3ab22}*{box-sizing:border-box}html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.stage{min-height:322px;max-width:720px;margin:auto}.caption{min-height:2.6em;margin:12px 0 0;color:var(--muted);font-size:14px}.btn{margin-top:8px;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--bg);font:inherit;cursor:pointer}.diagram{display:grid;gap:8px;min-height:322px}.doc,.model,.answer,.question{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.label{font-size:12px;color:var(--muted);margin-bottom:4px}.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.chunk{border:1px solid var(--line);border-radius:4px;padding:5px;font-size:12px;min-height:37px;opacity:.35;transition:opacity .35s,border-color .35s,background .35s}.chunk.show{opacity:1}.chunk.hit{border-color:var(--accent);background:var(--soft)}.bottom{display:grid;grid-template-columns:1.2fr .8fr;gap:8px}.model{display:grid;place-items:center;font-weight:650}.answer{opacity:0;transition:opacity .35s;border-color:var(--accent);background:var(--soft)}.answer.show{opacity:1}@media(max-width:390px){body{padding:12px}.stage,.diagram{min-height:300px}.chunk{padding:4px;font-size:11px}.caption{font-size:13px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="stage" id="stage"></div><p class="caption" id="caption" aria-live="polite"></p><button class="btn" id="replay">Chạy lại</button><script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;addEventListener('message',function(e){if(e.data&&(e.data.theme==='dark'||e.data.theme==='light'))document.documentElement.dataset.theme=e.data.theme});var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,stage=document.getElementById('stage'),caption=document.getElementById('caption'),timer,cycle,i;function reset(){var chunks=['#1 Nội quy','#2 Lương','#3 Nghỉ phép','#4 Bảo hiểm','#5 Phép năm','#6 Thiết bị','#7 Onboarding','#8 Liên hệ'];stage.innerHTML='<div class="diagram"><div class="doc"><div class="label">Tài liệu công ty</div>Chính sách nhân sự dài nhiều trang</div><div><div class="label">Kệ các mẩu đã cắt</div><div class="shelf">'+chunks.map(function(x,n){return '<div class="chunk" id="c'+n+'">'+x+'</div>'}).join('')+'</div></div><div class="bottom"><div><div class="question">Câu hỏi: “Chính sách nghỉ phép mấy ngày?”</div><div class="answer" id="answer">Trả lời dựa trên tài liệu<br><small>Nguồn: mẩu #3, #5</small></div></div><div class="model" id="model">MODEL</div></div></div>'}var steps=[['Bước 1: Một tài liệu dài được chuẩn bị cho hệ thống.',function(){}],['Bước 2: Tài liệu được cắt thành nhiều mẩu nhỏ và xếp lên kệ.',function(){for(var n=0;n<8;n++)document.getElementById('c'+n).classList.add('show')}],['Bước 3: Người dùng đặt câu hỏi về nghỉ phép.',function(){}],['Bước 4: Hệ thống tìm các mẩu gần nghĩa nhất: #3 và #5.',function(){[2,4].forEach(function(n){document.getElementById('c'+n).classList.add('hit')})}],['Bước 5: Chỉ câu hỏi cùng mẩu liên quan được đưa cho model để trả lời có nguồn.',function(){document.getElementById('answer').classList.add('show')}]];function play(){clearTimeout(timer);clearTimeout(cycle);reset();i=0;if(reduce){steps.forEach(function(s){s[1]()});caption.textContent='1. Chuẩn bị tài liệu.  2. Cắt thành mẩu.  3. Nhận câu hỏi.  4. Tìm mẩu gần nghĩa.  5. Trả lời kèm nguồn.';return}(function n(){if(i>=steps.length){cycle=setTimeout(play,3000);return}caption.textContent=steps[i][0];steps[i++][1]();timer=setTimeout(n,1800)})()}document.getElementById('replay').onclick=play;play();function h(){try{parent.postMessage({type:'minhhoa-height',height:document.body.scrollHeight},'*')}catch(e){}}addEventListener('load',h);if(window.ResizeObserver)new ResizeObserver(h).observe(document.body)})();</script></body></html>
