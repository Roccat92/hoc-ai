<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minh họa: AI, ML, Deep Learning và GenAI</title>
<style>
  :root{
    --bg:#f7faf8;--panel:#fff;--fg:#12211c;--muted:#53645e;--line:#9bada6;
    --accent:#087c72;--accent-soft:#087c7221;--wash-1:#edf5f2;--wash-2:#e3efeb;--wash-3:#d5e8e2;
  }
  @media(prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0c1311;--panel:#131c19;--fg:#f4faf7;--muted:#b3c2bc;--line:#71877f;
      --accent:#62e5d8;--accent-soft:#62e5d82a;--wash-1:#17241f;--wash-2:#1b2d27;--wash-3:#203a32;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c1311;--panel:#131c19;--fg:#f4faf7;--muted:#b3c2bc;--line:#71877f;
    --accent:#62e5d8;--accent-soft:#62e5d82a;--wash-1:#17241f;--wash-2:#1b2d27;--wash-3:#203a32;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{padding:8px;background:var(--bg);color:var(--fg);font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
  .stage{width:100%;height:100%;max-width:760px;margin:auto;border:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:48px minmax(0,1fr) 61px;overflow:hidden}
  .topbar{padding:0 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .title strong{display:block;font-size:14px}.title span{display:block;color:var(--muted);font-size:11px;margin-top:1px}
  .controls{display:flex;gap:6px;flex:none}
  .icon-btn{width:32px;height:32px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);display:grid;place-items:center;cursor:pointer}
  .icon-btn.primary{border-color:var(--accent);background:var(--accent);color:var(--panel)}
  .icon-btn svg{width:14px;height:14px}.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .canvas{position:relative;min-height:0;overflow:hidden;background:var(--bg)}
  .rings{position:absolute;left:50%;top:50%;width:224px;height:224px;transform:translate(-50%,-50%)}
  .ring{position:absolute;left:50%;top:50%;border:1.5px solid var(--line);border-radius:50%;transform:translate(-50%,-50%) scale(.86);opacity:.12;transition:opacity .32s,transform .62s cubic-bezier(.16,1.16,.3,1),border-color .3s,box-shadow .3s,background-color .3s}
  .ring.visible{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .ring.active{border:2.5px solid var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
  .ring-ai{width:220px;height:220px;background:var(--wash-1)}
  .ring-ml{width:166px;height:166px;background:var(--wash-2)}
  .ring-dl{width:112px;height:112px;background:var(--wash-3)}
  .ring-gen{width:58px;height:58px;background:var(--panel)}
  .core{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:10px;font-weight:800;line-height:1.05;opacity:0;transition:opacity .3s,color .3s;z-index:2}
  .core.visible{opacity:1}.core.active{color:var(--accent)}

  .leaders{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .leaders.mobile{display:none}
  .leader{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:330;stroke-dashoffset:330;opacity:.35;transition:stroke-dashoffset .72s ease,stroke .3s,opacity .3s,stroke-width .3s}
  .leader.visible{stroke-dashoffset:0;opacity:.82}.leader.active{stroke:var(--accent);stroke-width:2.2;opacity:1}
  .leader-dot{fill:var(--panel);stroke:var(--line);stroke-width:1.4;opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.2);transition:opacity .25s .42s,transform .38s .42s,stroke .3s,fill .3s}
  .leader-dot.visible{opacity:1;transform:scale(1)}.leader-dot.active{fill:var(--accent);stroke:var(--accent)}

  .callout{position:absolute;width:172px;padding:3px 5px;background:var(--bg);opacity:.22;transform:translateY(5px);transition:opacity .35s,transform .48s,color .3s}
  .callout.visible{opacity:1;transform:none}.callout.active .callout-name{color:var(--accent)}
  .callout-ai{left:12px;top:12px}.callout-ml{right:12px;top:12px}.callout-dl{left:12px;bottom:11px}.callout-gen{right:12px;bottom:11px}
  .callout-name{display:block;font-size:13px;font-weight:820;line-height:1.15;transition:color .3s}
  .callout-what{display:block;margin-top:3px;color:var(--fg);font-size:11px;font-weight:650}
  .callout-example{display:block;margin-top:2px;color:var(--muted);font-size:10px}

  .footer{border-top:1px solid var(--line);padding:7px 12px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
  .steps{display:flex;gap:5px}.step{width:18px;height:3px;background:var(--line);transition:background .25s,width .25s}.step.on{width:30px;background:var(--accent)}
  .caption{margin:0;color:var(--muted);font-size:12px;line-height:1.28}.caption strong{color:var(--fg)}

  @media(max-width:520px){
    body{padding:6px}.stage{grid-template-rows:46px minmax(0,1fr) 67px}.topbar{padding:0 9px}.title strong{font-size:13px}.title span{font-size:9.5px}
    .rings{width:166px;height:166px}.ring-ai{width:164px;height:164px}.ring-ml{width:124px;height:124px}.ring-dl{width:84px;height:84px}.ring-gen{width:44px;height:44px}.core{font-size:8px}
    .leaders.desktop{display:none}.leaders.mobile{display:block}
    .callout{width:104px;padding:3px;background:var(--bg)}.callout-ai{left:5px;top:8px}.callout-ml{right:5px;top:8px}.callout-dl{left:5px;bottom:8px}.callout-gen{right:5px;bottom:8px}
    .callout-name{font-size:10px}.callout-what{font-size:9px;line-height:1.18;margin-top:2px}.callout-example{font-size:8px;line-height:1.15}
    .footer{padding:6px 8px;gap:8px}.step{width:11px}.step.on{width:18px}.caption{font-size:10.5px}
  }
  @media(prefers-reduced-motion:reduce){
    :root:not([data-force-motion="true"]) *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<section class="stage" aria-label="AI, Máy học, Học sâu và AI tạo sinh là bốn lớp lồng nhau">
  <header class="topbar">
    <div class="title"><strong>Bốn lớp lồng nhau</strong><span>Cái sau nằm trọn trong cái trước</span></div>
    <div class="controls">
      <button class="icon-btn primary" id="play" type="button" aria-label="Phát hoạt cảnh" title="Phát"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.2 13.2 8 3 13.8Z" fill="currentColor"/></svg></button>
      <button class="icon-btn" id="replay" type="button" aria-label="Phát lại từ đầu" title="Phát lại"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.1 5.2A6 6 0 1 1 2 9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M3.1 1.8v3.4H6.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </header>

  <div class="canvas">
    <div class="rings" aria-hidden="true">
      <div class="ring ring-ai" id="ring-ai"></div>
      <div class="ring ring-ml" id="ring-ml"></div>
      <div class="ring ring-dl" id="ring-dl"></div>
      <div class="ring ring-gen" id="ring-gen"><span class="core" id="core">TẠO<br>MỚI</span></div>
    </div>

    <svg class="leaders desktop" viewBox="0 0 700 294" preserveAspectRatio="none" aria-hidden="true">
      <path class="leader" id="line-ai-d" d="M247 72 L184 30 L150 30"/><circle class="leader-dot" id="dot-ai-d" cx="247" cy="72" r="4"/>
      <path class="leader" id="line-ml-d" d="M409 91 L468 30 L550 30"/><circle class="leader-dot" id="dot-ml-d" cx="409" cy="91" r="4"/>
      <path class="leader" id="line-dl-d" d="M304 190 L223 259 L150 259"/><circle class="leader-dot" id="dot-dl-d" cx="304" cy="190" r="4"/>
      <path class="leader" id="line-gen-d" d="M371 169 L464 259 L550 259"/><circle class="leader-dot" id="dot-gen-d" cx="371" cy="169" r="4"/>
    </svg>
    <svg class="leaders mobile" viewBox="0 0 348 294" preserveAspectRatio="none" aria-hidden="true">
      <path class="leader" id="line-ai-m" d="M115 92 L89 29 L88 29"/><circle class="leader-dot" id="dot-ai-m" cx="115" cy="92" r="3.5"/>
      <path class="leader" id="line-ml-m" d="M215 105 L253 29 L260 29"/><circle class="leader-dot" id="dot-ml-m" cx="215" cy="105" r="3.5"/>
      <path class="leader" id="line-dl-m" d="M143 183 L89 263 L88 263"/><circle class="leader-dot" id="dot-dl-m" cx="143" cy="183" r="3.5"/>
      <path class="leader" id="line-gen-m" d="M187 164 L253 263 L260 263"/><circle class="leader-dot" id="dot-gen-m" cx="187" cy="164" r="3.5"/>
    </svg>

    <div class="callout callout-ai" id="callout-ai"><strong class="callout-name">AI</strong><span class="callout-what">Máy làm việc “thông minh”</span><span class="callout-example">GPS, bot chơi cờ</span></div>
    <div class="callout callout-ml" id="callout-ml"><strong class="callout-name">Máy học</strong><span class="callout-what">AI học từ dữ liệu</span><span class="callout-example">Bộ lọc thư rác</span></div>
    <div class="callout callout-dl" id="callout-dl"><strong class="callout-name">Học sâu</strong><span class="callout-what">ML dùng mạng neural</span><span class="callout-example">Nhận diện khuôn mặt</span></div>
    <div class="callout callout-gen" id="callout-gen"><strong class="callout-name">AI tạo sinh</strong><span class="callout-what">Tạo nội dung mới</span><span class="callout-example">ChatGPT, Claude</span></div>
  </div>

  <footer class="footer">
    <div class="steps"><span class="step" id="step-0"></span><span class="step" id="step-1"></span><span class="step" id="step-2"></span><span class="step" id="step-3"></span></div>
    <p class="caption" id="caption" aria-live="polite"></p>
  </footer>
</section>
<script>
(function(){
  var theme=new URLSearchParams(location.search).get('theme');
  if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;
  addEventListener('message',function(event){if(event.data&&(event.data.theme==='dark'||event.data.theme==='light'))document.documentElement.dataset.theme=event.data.theme});

  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,timer=null,cycle=null,current=0;
  var concepts=[
    {id:'ai',caption:'<strong>AI</strong> là vòng lớn nhất: mọi hệ thống bên trong đều là AI.'},
    {id:'ml',caption:'<strong>Máy học</strong> là một cách làm AI: máy tự rút quy luật từ dữ liệu.'},
    {id:'dl',caption:'<strong>Học sâu</strong> là một nhánh của Máy học, dùng mạng neural nhiều lớp.'},
    {id:'gen',caption:'<strong>AI tạo sinh</strong> là nhánh chuyên tạo chữ, ảnh, âm thanh, video hoặc code mới.'}
  ];
  function related(id){
    return [
      document.getElementById('ring-'+id),
      document.getElementById('callout-'+id),
      document.getElementById('line-'+id+'-d'),
      document.getElementById('dot-'+id+'-d'),
      document.getElementById('line-'+id+'-m'),
      document.getElementById('dot-'+id+'-m')
    ];
  }
  function clearState(){
    concepts.forEach(function(c,n){
      related(c.id).forEach(function(el){el.classList.remove('visible','active')});
      document.getElementById('step-'+n).className='step';
    });
    document.getElementById('core').className='core';
  }
  function show(index){
    concepts.forEach(function(c,n){
      related(c.id).forEach(function(el){el.classList.toggle('visible',n<=index);el.classList.toggle('active',n===index)});
      document.getElementById('step-'+n).classList.toggle('on',n===index);
    });
    document.getElementById('core').className='core'+(index>=3?' visible':'')+(index===3?' active':'');
    document.getElementById('caption').innerHTML=concepts[index].caption;
  }
  function play(force){
    clearTimeout(timer);clearTimeout(cycle);clearState();current=0;
    if(force)document.documentElement.dataset.forceMotion='true';
    if(reduce&&!force){show(3);document.getElementById('caption').innerHTML='<strong>Nhớ nhanh:</strong> AI tạo sinh ⊂ Học sâu ⊂ Máy học ⊂ AI.';return}
    (function next(){
      if(current>=concepts.length){
        document.getElementById('caption').innerHTML='<strong>Nhớ nhanh:</strong> AI tạo sinh ⊂ Học sâu ⊂ Máy học ⊂ AI.';
        if(!reduce)cycle=setTimeout(function(){play(false)},4000);
        return;
      }
      show(current);current++;timer=setTimeout(next,1900);
    })();
  }
  document.getElementById('play').addEventListener('click',function(){play(true)});
  document.getElementById('replay').addEventListener('click',function(){play(true)});
  play(false);
  function report(){try{parent.postMessage({type:'minhhoa-height',height:document.body.scrollHeight},'*')}catch(error){}}
  addEventListener('load',report);if(window.ResizeObserver)new ResizeObserver(report).observe(document.body);
})();
</script>
</body>
</html>
