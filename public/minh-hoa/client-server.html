<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minh họa: Trình duyệt và máy chủ</title><style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#6b7280;--line:#d9dde3;--accent:#2f6f6a;--soft:#2f6f6a22;--r:8px}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b1f;--fg:#e6e6e6;--muted:#9aa0a6;--line:#33353a;--accent:#5bb3ab;--soft:#5bb3ab22}}:root[data-theme=dark]{--bg:#1b1b1f;--fg:#e6e6e6;--muted:#9aa0a6;--line:#33353a;--accent:#5bb3ab;--soft:#5bb3ab22}*{box-sizing:border-box}html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.stage{min-height:220px;max-width:720px;margin:auto}.caption{min-height:2.6em;margin:12px 0 0;color:var(--muted);font-size:14px}.btn{margin-top:8px;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--bg);font:inherit;cursor:pointer}.network{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:center;min-height:220px}.box{border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center;min-height:90px;display:grid;place-items:center}.mid{color:var(--muted);font-size:13px}.server.busy{border-color:var(--accent);background:var(--soft)}.packet{position:absolute;padding:5px 8px;border:1px solid var(--accent);background:var(--bg);border-radius:4px;color:var(--fg);font-size:12px;opacity:0;transition:opacity .3s,transform 1s ease}.road{position:relative;height:1px;background:var(--line)}.packet.request{transform:translateX(-50px)}.packet.request.go,.packet.response.go{opacity:1;transform:translateX(50px)}.packet.response{transform:translateX(50px)}.packet.response.go{transform:translateX(-50px)}.page{font-size:12px;color:var(--accent);opacity:0}.page.show{opacity:1}@media(max-width:390px){body{padding:12px}.stage,.network{min-height:205px}.network{gap:7px}.box{padding:7px;min-height:76px;font-size:13px}.caption{font-size:13px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="stage" id="stage"></div><p class="caption" id="caption" aria-live="polite"></p><button class="btn" id="replay">Chạy lại</button><script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;addEventListener('message',function(e){if(e.data&&(e.data.theme==='dark'||e.data.theme==='light'))document.documentElement.dataset.theme=e.data.theme});var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,stage=document.getElementById('stage'),caption=document.getElementById('caption'),timer,cycle,i;function reset(){stage.innerHTML='<div class="network"><div class="box">Trình duyệt<br><span class="page" id="page">Trang đã hiện</span></div><div class="mid">Internet<div class="road"><span class="packet request" id="req">Yêu cầu</span><span class="packet response" id="res">Trang web</span></div></div><div class="box server" id="server">Máy chủ<br><small>(VPS)</small></div></div>'}var steps=[['Bước 1: Trình duyệt của bạn cần mở trang chủ.',function(){}],['Bước 2: Một yêu cầu đi qua Internet tới máy chủ.',function(){document.getElementById('req').classList.add('go')}],['Bước 3: Máy chủ (VPS) xử lý yêu cầu.',function(){document.getElementById('server').classList.add('busy')}],['Bước 4: Máy chủ gửi trang web trở lại qua Internet.',function(){document.getElementById('server').classList.remove('busy');document.getElementById('res').classList.add('go')}],['Bước 5: Trình duyệt nhận trang và hiển thị cho bạn.',function(){document.getElementById('page').classList.add('show')}]];function play(){clearTimeout(timer);clearTimeout(cycle);reset();i=0;if(reduce){steps.forEach(function(s){s[1]()});caption.textContent='1. Mở trang.  2. Gửi yêu cầu.  3. Máy chủ xử lý.  4. Gửi trang về.  5. Trình duyệt hiển thị.';return}(function n(){if(i>=steps.length){cycle=setTimeout(play,3000);return}caption.textContent=steps[i][0];steps[i++][1]();timer=setTimeout(n,1800)})()}document.getElementById('replay').onclick=play;play();function h(){try{parent.postMessage({type:'minhhoa-height',height:document.body.scrollHeight},'*')}catch(e){}}addEventListener('load',h);if(window.ResizeObserver)new ResizeObserver(h).observe(document.body)})();</script></body></html>
