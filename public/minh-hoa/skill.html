<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minh họa: Skill</title><style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#6b7280;--line:#d9dde3;--accent:#2f6f6a;--soft:#2f6f6a22;--r:8px}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b1f;--fg:#e6e6e6;--muted:#9aa0a6;--line:#33353a;--accent:#5bb3ab;--soft:#5bb3ab22}}:root[data-theme=dark]{--bg:#1b1b1f;--fg:#e6e6e6;--muted:#9aa0a6;--line:#33353a;--accent:#5bb3ab;--soft:#5bb3ab22}*{box-sizing:border-box}html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.stage{min-height:250px;max-width:720px;margin:auto}.caption{min-height:2.6em;margin:12px 0 0;color:var(--muted);font-size:14px}.btn{margin-top:8px;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--bg);font:inherit;cursor:pointer}.flow{display:grid;grid-template-columns:1.2fr .9fr 1.35fr;gap:12px;align-items:center;min-height:250px}.box{border:1px solid var(--line);border-radius:8px;padding:11px;min-height:94px}.label{font-size:12px;color:var(--muted);margin-bottom:5px}.ai{text-align:center;font-weight:650;display:grid;place-items:center}.book{border-color:var(--accent);background:var(--soft);opacity:0;transform:translateY(14px);transition:opacity .45s,transform .45s}.book.show{opacity:1;transform:none}.reply{opacity:.35;transition:opacity .35s,border-color .35s}.reply.good{opacity:1;border-color:var(--accent)}.reply p{margin:0}.line{height:1px;background:var(--line)}@media(max-width:390px){body{padding:12px}.stage,.flow{min-height:230px}.flow{gap:7px}.box{padding:7px;min-height:86px;font-size:13px}.caption{font-size:13px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="stage" id="stage"></div><p class="caption" id="caption" aria-live="polite"></p><button class="btn" id="replay">Chạy lại</button><script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;addEventListener('message',function(e){if(e.data&&(e.data.theme==='dark'||e.data.theme==='light'))document.documentElement.dataset.theme=e.data.theme});var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,stage=document.getElementById('stage'),caption=document.getElementById('caption'),timer,cycle,i;function reset(){stage.innerHTML='<div class="flow"><div class="box"><div class="label">Yêu cầu</div>Viết email xin nghỉ phép</div><div><div class="box ai">AI</div><div class="box book" id="book"><div class="label">Skill</div>Mẫu email công ty</div></div><div class="box reply" id="reply"><div class="label">Kết quả</div><p id="out">“Tôi xin nghỉ.”</p></div></div>'}var steps=[['Bước 1: AI nhận yêu cầu viết email.',function(){}],['Bước 2: Chưa có skill, kết quả thường chung chung.',function(){}],['Bước 3: Skill - cuốn sổ tay quy trình - được đưa cho AI.',function(){document.getElementById('book').classList.add('show')}],['Bước 4: AI làm theo mẫu: có kính gửi, lý do, thời gian và cam kết.',function(){var r=document.getElementById('reply');r.classList.add('good');document.getElementById('out').textContent='Kính gửi… · Lý do… · Thời gian… · Cam kết…'}],['Bước 5: Skill đóng gói quy trình để AI làm nhất quán hơn.',function(){}]];function play(){clearTimeout(timer);clearTimeout(cycle);reset();i=0;if(reduce){steps.forEach(function(s){s[1]()});caption.textContent='1. Nhận yêu cầu.  2. Kết quả chung chung.  3. Đưa skill vào.  4. Làm đúng mẫu.  5. Dùng lại quy trình.';return}(function n(){if(i>=steps.length){cycle=setTimeout(play,3000);return}caption.textContent=steps[i][0];steps[i++][1]();timer=setTimeout(n,1800)})()}document.getElementById('replay').onclick=play;play();function h(){try{parent.postMessage({type:'minhhoa-height',height:document.body.scrollHeight},'*')}catch(e){}}addEventListener('load',h);if(window.ResizeObserver)new ResizeObserver(h).observe(document.body)})();</script></body></html>
