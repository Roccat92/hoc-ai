<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minh họa: Vòng lặp Agent</title><style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#6b7280;--line:#d9dde3;--accent:#2f6f6a;--soft:#2f6f6a22;--r:8px}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b1f;--fg:#e6e6e6;--muted:#9aa0a6;--line:#33353a;--accent:#5bb3ab;--soft:#5bb3ab22}}:root[data-theme=dark]{--bg:#1b1b1f;--fg:#e6e6e6;--muted:#9aa0a6;--line:#33353a;--accent:#5bb3ab;--soft:#5bb3ab22}*{box-sizing:border-box}html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.stage{min-height:285px;max-width:720px;margin:auto}.caption{min-height:2.6em;margin:12px 0 0;color:var(--muted);font-size:14px}.btn{margin-top:8px;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--bg);font:inherit;cursor:pointer}.wrap{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center;min-height:285px}.loop{width:210px;height:210px;margin:auto;position:relative;border:1px solid var(--line);border-radius:50%}.node{position:absolute;display:grid;place-items:center;width:78px;height:48px;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px;text-align:center}.a{top:-7px;left:65px}.b{bottom:19px;left:-17px}.c{bottom:19px;right:-17px}.node.active{border-color:var(--accent);background:var(--soft)}.dot{width:11px;height:11px;border-radius:50%;background:var(--accent);position:absolute;top:41px;left:98px;transition:transform .55s ease}.dot.two{transform:translate(-82px,118px)}.dot.three{transform:translate(82px,118px)}.example{border-left:1px solid var(--line);padding-left:16px}.label{font-size:12px;color:var(--muted);margin-bottom:5px}.result{margin-top:12px;border:1px solid var(--accent);background:var(--soft);border-radius:8px;padding:9px;opacity:0;transition:opacity .35s}.result.show{opacity:1}@media(max-width:390px){body{padding:12px}.stage,.wrap{min-height:245px}.wrap{gap:10px}.loop{width:170px;height:170px}.node{width:64px;height:42px;font-size:11px}.a{top:-7px;left:52px}.b{bottom:13px;left:-13px}.c{bottom:13px;right:-13px}.dot{top:31px;left:79px}.dot.two{transform:translate(-64px,93px)}.dot.three{transform:translate(64px,93px)}.example{padding-left:10px;font-size:13px}.caption{font-size:13px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="stage" id="stage"></div><p class="caption" id="caption" aria-live="polite"></p><button class="btn" id="replay">Chạy lại</button><script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;addEventListener('message',function(e){if(e.data&&(e.data.theme==='dark'||e.data.theme==='light'))document.documentElement.dataset.theme=e.data.theme});var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,stage=document.getElementById('stage'),caption=document.getElementById('caption'),timer,cycle,i;function reset(){stage.innerHTML='<div class="wrap"><div class="loop"><div class="node a" id="think">Nghĩ</div><div class="node b" id="tool">Gọi công cụ</div><div class="node c" id="receive">Nhận kết quả</div><div class="dot" id="dot"></div></div><div class="example"><div class="label">Mục tiêu</div>Xem thời tiết Hà Nội rồi nhắc mang ô.<div class="result" id="result">Kết quả: Nhớ mang ô nhé!</div></div></div>'}function move(pos,id){document.getElementById('dot').className='dot '+pos;['think','tool','receive'].forEach(function(x){document.getElementById(x).classList.toggle('active',x===id)})}var steps=[['Bước 1: Agent nghĩ: cần biết thời tiết trước.',function(){move('','think')}],['Bước 2: Agent gọi công cụ thời tiết.',function(){move('two','tool')}],['Bước 3: Công cụ trả kết quả: Hà Nội có mưa.',function(){move('three','receive')}],['Bước 4: Agent nghĩ tiếp: trời mưa, nên nhắc mang ô.',function(){move('','think')}],['Bước 5: Đủ thông tin rồi, agent trả kết quả và dừng.',function(){document.getElementById('result').classList.add('show')}]];function play(){clearTimeout(timer);clearTimeout(cycle);reset();i=0;if(reduce){steps.forEach(function(s){s[1]()});caption.textContent='1. Nghĩ.  2. Gọi công cụ.  3. Nhận kết quả.  4. Nghĩ tiếp.  5. Hoàn thành.';return}(function n(){if(i>=steps.length){cycle=setTimeout(play,3000);return}caption.textContent=steps[i][0];steps[i++][1]();timer=setTimeout(n,1800)})()}document.getElementById('replay').onclick=play;play();function h(){try{parent.postMessage({type:'minhhoa-height',height:document.body.scrollHeight},'*')}catch(e){}}addEventListener('load',h);if(window.ResizeObserver)new ResizeObserver(h).observe(document.body)})();</script></body></html>
