<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minh họa: Token và chi phí API</title><style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#6b7280;--line:#d9dde3;--accent:#2f6f6a;--soft:#2f6f6a22;--r:8px}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1b1b1f;--fg:#e6e6e6;--muted:#9aa0a6;--line:#33353a;--accent:#5bb3ab;--soft:#5bb3ab22}}:root[data-theme=dark]{--bg:#1b1b1f;--fg:#e6e6e6;--muted:#9aa0a6;--line:#33353a;--accent:#5bb3ab;--soft:#5bb3ab22}*{box-sizing:border-box}html,body{margin:0}body{padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.stage{min-height:270px;max-width:720px;margin:auto}.caption{min-height:2.6em;margin:12px 0 0;color:var(--muted);font-size:14px}.btn{margin-top:8px;border:0;border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--bg);font:inherit;cursor:pointer}.card{border:1px solid var(--line);border-radius:8px;padding:13px}.range{width:100%;accent-color:var(--accent)}.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.sample{min-height:50px;margin:13px 0;padding:9px;border-left:2px solid var(--accent);background:var(--soft);font-size:13px}.numbers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.number{border:1px solid var(--line);border-radius:6px;padding:8px}.big{display:block;font-size:20px;font-weight:650}.notice{margin-top:10px;color:var(--muted);font-size:12px}@media(max-width:390px){body{padding:8px}.stage{min-height:252px}.card{padding:7px}.notice{margin-top:6px;font-size:11px;line-height:1.25}.sample{margin:8px 0;padding:7px}.caption{font-size:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="stage" id="stage"></div><p class="caption" id="caption" aria-live="polite"></p><button class="btn" id="replay">Chạy lại</button><script>(function(){var t=new URLSearchParams(location.search).get('theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;addEventListener('message',function(e){if(e.data&&(e.data.theme==='dark'||e.data.theme==='light'))document.documentElement.dataset.theme=e.data.theme});var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,stage=document.getElementById('stage'),caption=document.getElementById('caption'),timer,cycle;function reset(){stage.innerHTML='<div class="card"><label for="length">Độ dài văn bản</label><input class="range" id="length" type="range" min="1" max="100" value="15"><div class="ends"><span>Ít</span><span>Nhiều</span></div><div class="sample" id="sample"></div><div class="numbers"><div class="number"><span class="label">Token ước lượng</span><span class="big" id="tokens"></span></div><div class="number"><span class="label">Chi phí minh họa</span><span class="big" id="cost"></span></div></div><div class="notice">Số token và chi phí ở đây là ví dụ minh họa cách tính, KHÔNG phải giá thật — xem giá thật ở trang chính thức của hãng.</div></div>';document.getElementById('length').oninput=function(){clearTimeout(timer);clearTimeout(cycle);update(+this.value,'Bạn thay đổi độ dài: chữ nhiều hơn thì token và chi phí minh họa cũng tăng.')};update(15,'Bước 1: Văn bản ngắn dùng ít token.')};function update(v,text){var chars=Math.round(40+v*9),tokens=Math.round(chars/4),cost=tokens*2,sample=v<34?'Đây là văn bản minh họa ngắn.':v<68?'Đây là văn bản minh họa dài hơn, có thêm một vài ý để gửi cho AI.':'Đây là văn bản minh họa dài hơn. Nó có thêm nhiều câu và ngữ cảnh để cho thấy lượng chữ tăng lên, nhưng phần hiển thị được rút gọn cho dễ đọc.';document.getElementById('length').value=v;document.getElementById('sample').textContent=sample;document.getElementById('tokens').textContent=tokens+' token';document.getElementById('cost').textContent=cost+' đ';if(text)caption.textContent=text}function play(){clearTimeout(timer);clearTimeout(cycle);reset();if(reduce){update(100,'1. Văn bản dài hơn.  2. Token tăng.  3. Chi phí minh họa tăng.');return}var values=[15,45,75,100],i=0;(function n(){if(i>=values.length){caption.textContent='Bước 4: Văn bản càng dài, số token và chi phí minh họa càng tăng.';cycle=setTimeout(play,3000);return}update(values[i],['Bước 1: Văn bản ngắn dùng ít token.','Bước 2: Thêm chữ làm số token ước lượng tăng.','Bước 3: Token tăng thì chi phí minh họa tăng theo.','Bước 4: Kéo thanh trượt để tự thử.'][i]);i++;timer=setTimeout(n,1500)})()}document.getElementById('replay').onclick=play;play();function h(){try{parent.postMessage({type:'minhhoa-height',height:document.body.scrollHeight},'*')}catch(e){}}addEventListener('load',h);if(window.ResizeObserver)new ResizeObserver(h).observe(document.body)})();</script></body></html>
